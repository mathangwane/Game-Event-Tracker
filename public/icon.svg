<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1E1E"/>
      <stop offset="100%" stop-color="#0E0E0E"/>
    </linearGradient>
    <linearGradient id="tornGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
    <linearGradient id="farmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  
  <!-- Outer Ring with Torn / Farm Split -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#2A2A2A" stroke-width="12"/>
  <path d="M 256 46 A 210 210 0 0 1 256 466" fill="none" stroke="url(#tornGrad)" stroke-width="12" stroke-linecap="round"/>
  <path d="M 256 466 A 210 210 0 0 1 256 46" fill="none" stroke="url(#farmGrad)" stroke-width="12" stroke-linecap="round"/>

  <!-- Calendar Body Container (Safe Zone) -->
  <rect x="120" y="130" width="272" height="252" rx="36" fill="#1C1C1E" stroke="#333336" stroke-width="6"/>
  
  <!-- Calendar Header Strip -->
  <path d="M 120 166 C 120 146, 140 130, 156 130 L 356 130 C 372 130, 392 146, 392 166 L 392 205 L 120 205 Z" fill="#262629"/>

  <!-- Binder Rings -->
  <rect x="180" y="105" width="22" height="48" rx="11" fill="url(#tornGrad)"/>
  <rect x="310" y="105" width="22" height="48" rx="11" fill="url(#farmGrad)"/>

  <!-- Game Symbols Inside Calendar Grid -->
  <!-- Left Side: Torn Crimson Knife/Flame Crest -->
  <g transform="translate(150, 230)">
    <rect width="90" height="120" rx="18" fill="#26181A" stroke="#DC2626" stroke-width="3"/>
    <circle cx="45" cy="45" r="22" fill="#DC2626" opacity="0.25"/>
    <path d="M 45 28 L 52 48 L 45 62 L 38 48 Z" fill="#EF4444"/>
    <circle cx="45" cy="85" r="6" fill="#EF4444"/>
    <text x="45" y="108" font-family="sans-serif" font-weight="700" font-size="14" fill="#FCA5A5" text-anchor="middle">TORN</text>
  </g>

  <!-- Right Side: Farm RPG Green Sprout/Leaf Crest -->
  <g transform="translate(272, 230)">
    <rect width="90" height="120" rx="18" fill="#15261A" stroke="#16A34A" stroke-width="3"/>
    <circle cx="45" cy="45" r="22" fill="#16A34A" opacity="0.25"/>
    <path d="M 45 60 C 45 42, 32 30, 32 30 C 32 30, 58 32, 58 48 C 58 56, 45 60, 45 60 Z" fill="#22C55E"/>
    <circle cx="45" cy="85" r="6" fill="#22C55E"/>
    <text x="45" y="108" font-family="sans-serif" font-weight="700" font-size="13" fill="#86EFAC" text-anchor="middle">FARM RPG</text>
  </g>
</svg>
